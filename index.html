<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Till's To Do App</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before the page draws, so it doesn't flash light first.
    try {
      const savedTheme = localStorage.getItem("todo-app-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch {}
  </script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Till's To Do App</h1>
      <button id="theme-toggle" type="button" class="theme-toggle"></button>
    </header>

    <form id="task-form" class="task-form">
      <input
        id="task-input"
        type="text"
        placeholder="What needs to be done?"
        autocomplete="off"
        aria-label="New task"
        required
      >
      <button type="submit">Add</button>
    </form>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state">No tasks yet. Add one above.</p>

    <div id="list-footer" class="list-footer">
      <span id="task-count" class="task-count" aria-live="polite"></span>
      <button id="clear-completed" type="button" class="clear-btn">Clear completed</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
